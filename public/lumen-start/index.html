<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c0b10">
<title>Lumen Start</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="wallpaperBase"></div>
<img id="wallpaperImg" alt="">
<div id="shade"></div>
<div id="grain"></div>

<main class="shell">
  <header class="top">
    <div class="clock" id="clockBox"><div class="time" id="time">--:--</div><div class="date" id="date">---</div></div>
    <div class="top-actions">
      <button class="glass-btn" id="shuffleBtn" aria-label="壁紙変更"><svg viewBox="0 0 24 24"><path d="M16 3h5v5h-2V6.4l-4.6 4.6-1.4-1.4L17.6 5H16V3ZM4 6h3.1c1.2 0 2.2.5 3 1.3l7.5 9.3H21v2h-4.4L8.6 8.7A2 2 0 0 0 7.1 8H4V6Zm0 10h3.1c.6 0 1.2-.3 1.6-.8l2.2-2.7 1.3 1.6-2 2.5A4 4 0 0 1 7.1 18H4v-2Z"/></svg></button>
      <button class="glass-btn alt" id="settingsBtn" aria-label="設定"><svg viewBox="0 0 24 24"><path d="m19.4 13 .1-1-.1-1 2-1.5-2-3.5-2.4 1a8 8 0 0 0-1.7-1L15 3h-4l-.4 3a8 8 0 0 0-1.7 1L6.5 6l-2 3.5 2 1.5-.1 1 .1 1-2 1.5 2 3.5 2.4-1a8 8 0 0 0 1.7 1l.4 3h4l.4-3a8 8 0 0 0 1.7-1l2.4 1 2-3.5-2-1.5ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg></button>
    </div>
  </header>

  <div class="hero" id="hero"></div>

  <section class="deck">
    <form class="search" id="searchForm">
      <button type="button" class="engine" id="engineBtn">B</button>
      <input id="query" placeholder="検索または URL" autocomplete="off" autocapitalize="none" spellcheck="false">
      <button class="go" aria-label="検索"><svg viewBox="0 0 24 24"><path d="m20.3 19-4.6-4.6a7 7 0 1 0-1.4 1.4l4.6 4.6 1.4-1.4ZM5 10.5a5.5 5.5 0 1 1 11 0 5.5 5.5 0 0 1-11 0Z"/></svg></button>
    </form>

    <section class="panel">
      <div class="panel-head"><span>ショートカット</span><button class="text-btn" id="editBtn">編集</button></div>
      <div class="grid" id="grid"></div>
    </section>

    <div class="quick-row">
      <button class="quick" id="addBtn"><span class="qicon"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg></span><span><b>追加</b><small>サイト</small></span></button>
      <button class="quick" id="wallBtn"><span class="qicon"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4V4Zm2 2v8.3l3.2-3.2 2.5 2.5 2.9-3.6L18 14.2V6H6Z"/></svg></span><span><b>壁紙</b><small id="wallCount">0枚</small></span></button>
    </div>
  </section>
</main>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="settingsSheet">
  <div class="handle"></div>
  <div class="sheet-head"><div><div class="eyebrow">LUMEN / M3E × GLASS</div><h2>カスタマイズ</h2></div><button class="glass-btn closeBtn">×</button></div>

  <div class="group-title">壁紙</div>
  <div class="wall-strip" id="wallStrip"></div>
  <div class="settings">
    <label class="setting"><span><b>壁紙を追加</b><small>選ぶと即時表示</small></span><span class="file">画像を選ぶ<input id="wallInput" type="file" accept="image/*" multiple></span></label>
    <label class="setting"><span><b>ランダム切替</b><small>登録画像から自動変更</small></span><select id="rotation"><option value="open">開くたび</option><option value="15">15分</option><option value="30">30分</option><option value="60">1時間</option><option value="daily">1日</option><option value="manual">手動</option></select></label>
    <label class="setting slider"><div class="slider-top"><span><b>壁紙の明るさ</b><small>画像そのもの</small></span><span class="value" id="brightnessValue">100%</span></div><input id="brightness" type="range" min="35" max="145" value="100"></label>
    <label class="setting slider"><div class="slider-top"><span><b>暗幕</b><small>UI可読性</small></span><span class="value" id="shadeValue">18%</span></div><input id="shadeRange" type="range" min="0" max="65" value="18"></label>
    <label class="setting slider"><div class="slider-top"><span><b>壁紙ぼかし</b><small>背景の質感</small></span><span class="value" id="wallBlurValue">0px</span></div><input id="wallBlur" type="range" min="0" max="10" value="0"></label>
    <label class="setting"><span><b>壁紙位置</b><small>人物・主題に合わせる</small></span><select id="wallPosition"><option value="center">中央</option><option value="top">上</option><option value="bottom">下</option><option value="left">左</option><option value="right">右</option></select></label>
    <button class="setting" id="clearWalls"><span><b>壁紙を全部削除</b><small>元画像は消えません</small></span><span class="danger">削除</span></button>
  </div>

  <div class="group-title">質感</div>
  <div class="settings">
    <label class="setting"><span><b>アクセント</b><small>壁紙から自動抽出可能</small></span><select id="accentMode"><option value="auto">壁紙から自動</option><option value="276">紫</option><option value="330">ピンク</option><option value="216">青</option><option value="162">ミント</option><option value="42">アンバー</option></select></label>
    <label class="setting slider"><div class="slider-top"><span><b>ガラス透明度</b><small>カードの濃さ</small></span><span class="value" id="glassAlphaValue">50%</span></div><input id="glassAlpha" type="range" min="25" max="82" value="50"></label>
    <label class="setting slider"><div class="slider-top"><span><b>ガラスぼかし</b><small>Apple寄りの質感</small></span><span class="value" id="glassBlurValue">26px</span></div><input id="glassBlur" type="range" min="0" max="36" value="26"></label>
  </div>

  <div class="group-title">密度</div>
  <div class="settings">
    <label class="setting"><span><b>列数</b><small>標準は6列</small></span><select id="columns"><option value="5">5列</option><option value="6">6列</option><option value="7">7列</option></select></label>
    <label class="setting slider"><div class="slider-top"><span><b>アイコンサイズ</b><small>全体を小さく/大きく</small></span><span class="value" id="iconSizeValue">40px</span></div><input id="iconSize" type="range" min="32" max="50" value="40"></label>
    <label class="setting slider"><div class="slider-top"><span><b>縦間隔</b><small>ショートカット密度</small></span><span class="value" id="gapValue">7px</span></div><input id="gap" type="range" min="2" max="12" value="7"></label>
    <label class="setting"><span><b>ラベル表示</b><small>さらにミニマルにできる</small></span><span class="switch"><input type="checkbox" id="showLabels" checked><span class="track"></span></span></label>
    <label class="setting"><span><b>時計表示</b><small>壁紙を広く見せたい場合OFF</small></span><span class="switch"><input type="checkbox" id="showClock" checked><span class="track"></span></span></label>
  </div>

  <div class="group-title">ショートカット</div>
  <div class="settings">
    <label class="setting"><span><b>アイコン取得</b><small>サイトfaviconを自動表示</small></span><select id="iconProvider"><option value="auto">サイト → Google予備</option><option value="google">Google Favicons</option><option value="duck">DuckDuckGo Icons</option><option value="letter">文字のみ</option></select></label>
  </div>

  <div class="group-title">検索</div>
  <div class="settings">
    <label class="setting"><span><b>検索エンジン</b><small>既定の検索先</small></span><select id="engineSelect"><option value="brave">Brave</option><option value="google">Google</option><option value="duck">DuckDuckGo</option><option value="startpage">Startpage</option><option value="bing">Bing</option></select></label>
  </div>
</section>

<section class="sheet" id="shortcutSheet">
  <div class="handle"></div>
  <div class="sheet-head"><div><div class="eyebrow">SHORTCUT</div><h2 id="formTitle">サイトを追加</h2></div><button class="glass-btn closeBtn">×</button></div>
  <form class="form" id="shortcutForm">
    <input type="hidden" id="shortcutIndex">
    <label>名前<input id="shortcutName" required maxlength="18"></label>
    <label>URL<input id="shortcutUrl" required inputmode="url" autocapitalize="none"></label>
    <label>カスタムアイコンURL（任意）<input id="shortcutIcon" inputmode="url" autocapitalize="none"></label>
    <div class="form-actions"><button type="button" class="delete" id="deleteShortcut" hidden>削除</button><button class="primary">保存</button></div>
  </form>
</section>

<div class="toast" id="toast"></div>
<script src="./app.js"></script>
</body>
</html>
